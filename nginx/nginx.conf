user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        text/vtt vtt;
    }
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/csv text/vtt
               application/vnd.apple.mpegurl image/svg+xml;

    client_max_body_size 10m;
    proxy_read_timeout 120s;

    upstream api {
        server api:8000;
        keepalive 16;
    }


    server {
        listen 80;
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;

        location /api/ {
            include /etc/nginx/snippets/proxy-api.conf;
        }

        # Bulk user import hashes thousands of temporary passwords.
        location ^~ /api/v1/admin/users/import {
            proxy_read_timeout 600s;
            include /etc/nginx/snippets/proxy-api.conf;
        }

        # Lesson video upload: up to 2 GB, streamed straight to the API.
        location ~ ^/api/v1/admin/lesson-versions/[0-9]+/video$ {
            client_max_body_size 2100m;
            client_body_timeout 3600s;
            proxy_request_buffering off;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            include /etc/nginx/snippets/proxy-api.conf;
        }

        # Lesson guide PDFs: the API accepts up to 50 MB and answers with its own size error.
        location ~ ^/api/v1/admin/lesson-versions/[0-9]+/pdf/(uz|ru)$ {
            client_max_body_size 51m;
            include /etc/nginx/snippets/proxy-api.conf;
        }

        location = /_media_auth {
            internal;
            proxy_pass http://api/api/v1/internal/media-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Only these media folders are served; original uploads and certificates are not.
        location /media/ {
            return 404;
        }

        location ~ ^/media/(hls|vtt|pdf|img)/ {
            auth_request /_media_auth;
            root /data;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
